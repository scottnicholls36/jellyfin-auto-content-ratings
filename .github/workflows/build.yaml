name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test Jellyfin.Plugin.ContentRatings.slnx -c Release

      - name: Build plugin
        run: dotnet build Jellyfin.Plugin.ContentRatings/Jellyfin.Plugin.ContentRatings.csproj -c Release -o out

      - name: Package
        run: |
          version=$(grep '^version:' build.yaml | sed 's/version: *"\(.*\)"/\1/')
          mkdir -p package
          cp out/Jellyfin.Plugin.ContentRatings.dll package/
          cat > package/meta.json <<EOF
          {
            "category": "Metadata",
            "changelog": "",
            "description": "Automatically sets content ratings from TMDB or TVDB.",
            "guid": "44c838b7-b4cc-4cdf-bc1d-3f8fe3ce3748",
            "name": "Auto Content Ratings",
            "overview": "Automatically sets content ratings (PG, 12, 15...) from TMDB or TVDB",
            "owner": "scottnicholls36",
            "targetAbi": "12.0.0.0",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "version": "${version}",
            "status": "Active",
            "autoUpdate": false,
            "assemblies": ["Jellyfin.Plugin.ContentRatings.dll"]
          }
          EOF
          (cd package && zip -r ../auto-content-ratings_${version}.zip .)
          echo "ZIP=auto-content-ratings_${version}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: auto-content-ratings
          path: ${{ env.ZIP }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
