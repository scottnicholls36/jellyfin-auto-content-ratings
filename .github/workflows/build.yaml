name: Build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test Jellyfin.Plugin.ContentRatings.slnx -c Release

      - name: Package
        run: |
          version=$(sed -n 's/^version: *"\(.*\)"/\1/p' build.yaml)
          echo "ZIP=$(scripts/package.sh "$version" | tail -n 1)" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: auto-content-ratings
          path: ${{ env.ZIP }}
